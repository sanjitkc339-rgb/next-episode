<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Episode – Anime picks for your mood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">Next<span>Episode</span></div>
  <button class="btn small" id="theme" aria-label="Toggle light and dark theme">Theme</button>
</header>

<section class="hero">
  <div>
    <h1>What do you feel like watching tonight?</h1>
    <p class="lead">Choose a mood and get one anime to start right now. Don't like it? Pick another.</p>
    <div class="chips" id="moods" role="group" aria-label="Moods"></div>
    <p style="margin:18px 0 0"><button class="btn" id="roll">Pick one for me</button></p>
  </div>
  <article class="pick" id="pick" aria-live="polite"></article>
</section>

<section>
  <h2 style="font-size:1.6rem;margin-bottom:12px">Browse all picks</h2>
  <div class="tools">
    <input id="q" type="search" placeholder="Search titles or story keywords" aria-label="Search anime">
    <select id="sort" aria-label="Sort by">
      <option value="score">Top rated</option>
      <option value="year">Newest</option>
      <option value="eps">Shortest</option>
      <option value="title">A to Z</option>
    </select>
    <button class="chip" id="onlyFav" aria-pressed="false">My watchlist</button>
  </div>
  <div class="chips" id="genres" role="group" aria-label="Genres" style="margin-bottom:14px"></div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</section>

<footer>Scores are approximate community ratings. Your watchlist is saved only in this browser.</footer>
</div>

<script src="app.js"></script>
</body>
</html>
